<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso | Painel</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0d0b21,#171240);color:#eef0ff;font:15px system-ui;min-height:100vh}main{max-width:1100px;padding:28px 20px;margin:auto}nav,header{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}a{color:#b6caff}h1{font-size:26px}.card,dialog{background:linear-gradient(145deg,#1b1740,#221d52);border:1px solid #ffffff20;border-radius:16px;padding:24px;box-shadow:0 18px 40px #0004}.card{margin-top:20px}.estreito{max-width:440px;margin:9vh auto}label{display:block;color:#aaa6ca;font-size:12px;margin:14px 0 7px}input:not([type=checkbox]),select{width:100%;padding:12px;background:#100d2d;color:white;border:1px solid #ffffff25;border-radius:10px;font:inherit}button{padding:11px 16px;background:#ffffff0a;border:1px solid #ffffff25;border-radius:10px;color:white;font:inherit;cursor:pointer;margin:4px}button.primario{background:linear-gradient(135deg,#4f7cff,#8b5cf6);border:0}button:disabled{opacity:.5}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{padding:12px;text-align:left;border-bottom:1px solid #ffffff15}small,p{color:#aaa6ca;line-height:1.6}#msg,#erro{white-space:pre-wrap;color:#ffb4c1}.scroll{overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}dialog{color:#eef0ff;width:min(600px,94vw);max-height:92vh}dialog::backdrop{background:#070514cc;backdrop-filter:blur(5px)}[hidden]{display:none!important}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><main><nav id="nav" hidden><a id="voltar" href="/painel">Painel</a><span><a href="/senha">Alterar senha</a> <button id="sair">Sair</button></span></nav><section id="entrada" class="card estreito" hidden><h1>Entrar no painel</h1><form id="loginForm"><label>Login</label><input id="login" autocomplete="username" required><label>Senha</label><input id="senhaLogin" type="password" autocomplete="current-password" required><p><button class="primario">Entrar</button></p></form></section><section id="troca" class="card estreito" hidden><h1>Alterar senha</h1><p>Senhas temporárias devem ser trocadas antes de acessar o painel. Use ao menos 12 caracteres.</p><form id="senhaForm"><label>Senha atual</label><input id="atual" type="password" autocomplete="current-password" required><label>Nova senha</label><input id="nova" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label>Confirmar nova senha</label><input id="confirmar" type="password" required><p><button class="primario">Salvar nova senha</button></p></form></section><section id="gestao" hidden><header><h1 id="titulo"></h1><button id="novo" class="primario"></button></header><div id="buscaBox"><input id="busca" placeholder="Buscar cliente por nome, login ou contato"><button id="buscar">Buscar</button></div><section class="card scroll"><table><thead id="cabeca"></thead><tbody id="lista"></tbody></table></section><button id="anterior">Anterior</button><button id="proxima">Próxima</button></section><p id="msg" role="status"></p></main><dialog id="modal"><h2 id="tituloModal"></h2><form id="form"><div class="grid"><div><label>Nome</label><input id="nome" required maxlength="100"></div><div><label>Login</label><input id="usuario"></div><div id="senhaBox"><label>Senha temporária (mínimo 12 caracteres)</label><input id="senhaConta" type="password" minlength="12" maxlength="128" autocomplete="new-password"></div><div id="papelBox"><label>Perfil</label><select id="papel"><option value="usuario">Usuário</option><option value="admin">Administrador</option></select><label><input id="ativo" type="checkbox" checked> Ativo</label></div><div id="contatoBox"><label>Contato / WhatsApp</label><input id="contato"></div><div id="produtoBox"><label>Produto</label><select id="produto"></select></div><div id="planoBox"><label>Plano opcional</label><select id="plano"></select></div><div id="quantidadeBox"><label>Quantidade de acessos</label><input id="quantidade" type="number" min="1" value="1"></div><div id="valorBox"><label>Valor total cobrado</label><input id="valor" inputmode="numeric"></div><div id="descontoBox"><label>Desconto</label><input id="desconto" inputmode="numeric"></div><div id="vencimentoBox"><label>Vencimento</label><input id="vencimento" type="date"></div><div id="diasBox"><label>Dias da renovação</label><input id="dias" type="number" min="1" max="3650" value="30"></div><div id="formaBox"><label>Forma de pagamento</label><select id="forma"><option>PIX</option><option>DINHEIRO</option><option>CARTAO</option><option>BOLETO</option></select></div></div><p id="erro" role="alert"></p><button type="button" id="cancelar">Cancelar</button><button class="primario">Salvar</button></form></dialog><script>
const $=id=>document.getElementById(id),moeda=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let eu=null,contas=false,editando=null,modo='',catalogo={produtos:[],planos:[]},pagina=0,ocupado=false;
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-Painel':'1'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok){if(r.status===401&&location.pathname!='/login')location.href='/login';throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail))}return d}
function dinheiro(id,v){$(id).dataset.centavos=String(Math.round(Number(v||0)*100));$(id).value=moeda(v||0)}for(const id of ['valor','desconto'])$(id).oninput=()=>{const n=Number($(id).value.replace(/\D/g,'')||0);$(id).dataset.centavos=String(n);$(id).value=moeda(n/100)};
function opcao(id,v,t){const o=document.createElement('option');o.value=v;o.textContent=t;$(id).appendChild(o)}
function listarPlanos(selecionado=''){$('plano').replaceChildren();opcao('plano','','Sem plano');for(const p of catalogo.planos.filter(p=>(p.produto||'').toUpperCase()===$('produto').value.toUpperCase()))opcao('plano',p.id,p.nome+' — '+moeda(p.valor));if(editando?.plano_id&&!catalogo.planos.some(p=>p.id===editando.plano_id))opcao('plano',editando.plano_id,editando.plano_nome+' (histórico)');$('plano').value=selecionado}
$('produto').onchange=()=>listarPlanos();$('plano').onchange=()=>{const p=catalogo.planos.find(p=>String(p.id)===$('plano').value);if(p)dinheiro('valor',p.valor)};
function irPainel(){location.href=eu.papel==='admin'?'/painel':'/clientes'}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(ocupado)return;ocupado=true;try{eu=await api('/auth/login','POST',{login:$('login').value,senha:$('senhaLogin').value});if(eu.trocar_senha)location.href='/senha';else irPainel()}catch(err){$('msg').textContent=err.message}finally{ocupado=false}};
$('senhaForm').onsubmit=async e=>{e.preventDefault();if(ocupado)return;if($('nova').value!==$('confirmar').value){$('msg').textContent='As novas senhas não coincidem.';return}ocupado=true;try{await api('/auth/senha','POST',{atual:$('atual').value,nova:$('nova').value});irPainel()}catch(err){$('msg').textContent=err.message}finally{ocupado=false}};
$('sair').onclick=async()=>{await api('/auth/logout','POST',{});localStorage.removeItem('assinaturas.apiKey');location.href='/login'};
async function carregar(){const dados=contas?await api('/auth/usuarios'):await api('/assinaturas?limite=50&deslocamento='+pagina*50+'&q='+encodeURIComponent($('busca').value));const lista=contas?dados:dados.itens;$('lista').replaceChildren();for(const p of lista){const tr=document.createElement('tr');for(const v of contas?[p.nome,p.login,p.papel,p.ativo?'Ativo':'Inativo']:[p.nome,p.usuario||'—',p.plano_nome||p.produto||'—',p.vencimento||'—',moeda(p.valor_final)]){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}const td=document.createElement('td');for(const [texto,acao] of contas?[['Editar',()=>abrir(p,'conta')]]:[['Editar',async()=>abrir(await api('/assinaturas/'+p.id),'cliente')],['Renovar',async()=>abrir(await api('/assinaturas/'+p.id),'renovar')],['Suspender',async()=>{if(confirm('Suspender '+p.nome+'?')){await api('/assinaturas/'+p.id+'/suspender','POST',{});await carregar()}}]]){const b=document.createElement('button');b.textContent=texto;b.onclick=async()=>{try{await acao()}catch(err){$('msg').textContent=err.message}};td.appendChild(b)}tr.appendChild(td);$('lista').appendChild(tr)}$('anterior').disabled=pagina===0;$('proxima').disabled=contas||(pagina+1)*50>=dados.total}
async function abrir(p=null,m=contas?'conta':'cliente'){if(ocupado)return;editando=p;modo=m;const c=m==='conta',r=m==='renovar';for(const [id,mostrar] of Object.entries({senhaBox:c,papelBox:c,contatoBox:!c&&!r,produtoBox:!c&&!r,planoBox:!c&&!r,quantidadeBox:!c&&!r,valorBox:!c,descontoBox:!c&&!r,vencimentoBox:!c&&!r,diasBox:r,formaBox:!c}))$(id).hidden=!mostrar;$('nome').disabled=r;$('usuario').disabled=r||(c&&!!p);$('tituloModal').textContent=r?'Renovar cliente':(p?'Editar ':'Novo ')+(c?'usuário':'cliente');$('nome').value=p?.nome||'';$('usuario').value=c?p?.login||'':p?.usuario||'';$('contato').value=p?.contato||'';$('senhaConta').value='';$('senhaConta').required=c&&!p;$('papel').value=p?.papel||'usuario';$('ativo').checked=p?p.ativo:true;$('quantidade').value=p?.conexoes||1;dinheiro('valor',p?.valor_final||0);dinheiro('desconto',p?.desconto||0);$('vencimento').value=p?.vencimento||'';$('forma').value=p?.forma_pagamento||'PIX';$('erro').textContent='';if(!c&&!r){catalogo=await api('/auth/catalogo');$('produto').replaceChildren();opcao('produto','','Selecione');for(const prod of catalogo.produtos)opcao('produto',prod.nome,prod.nome);if(p?.produto&&!catalogo.produtos.some(x=>x.nome===p.produto))opcao('produto',p.produto,p.produto+' (histórico)');$('produto').value=p?.produto||'';listarPlanos(p?.plano_id?String(p.plano_id):'')}$('modal').showModal()}
$('form').onsubmit=async e=>{e.preventDefault();if(ocupado)return;ocupado=true;try{if(modo==='conta'){const d=editando?{ativo:$('ativo').checked,papel:$('papel').value}:{login:$('usuario').value,nome:$('nome').value,papel:$('papel').value,senha:$('senhaConta').value};if(editando&&$('senhaConta').value)d.senha=$('senhaConta').value;await api(editando?'/auth/usuarios/'+editando.id:'/auth/usuarios',editando?'PATCH':'POST',d)}else{const valor=Number($('valor').dataset.centavos)/100,desconto=Number($('desconto').dataset.centavos)/100;if(!Number.isFinite(valor)||valor<0)throw Error('Valor inválido.');if(modo==='renovar'){await api('/assinaturas/'+editando.id+'/renovar','POST',{dias:Number($('dias').value),valor,forma_pagamento:$('forma').value})}else{if(!$('produto').value)throw Error('Selecione um produto.');if(desconto>valor)throw Error('Desconto maior que a venda.');const plano=catalogo.planos.find(p=>String(p.id)===$('plano').value),historico=editando&&String(editando.plano_id)===$('plano').value;const d={nome:$('nome').value,usuario:$('usuario').value||null,contato:$('contato').value||null,produto:$('produto').value,plano_id:plano?.id||(historico?editando.plano_id:null),plano_nome:plano?.nome||(historico?editando.plano_nome:null),conexoes:Number($('quantidade').value),valor,desconto,forma_pagamento:$('forma').value};if($('vencimento').value)d.vencimento=$('vencimento').value;await api(editando?'/assinaturas/'+editando.id:'/assinaturas',editando?'PATCH':'POST',d)}}$('modal').close();$('msg').textContent='Salvo.';await carregar()}catch(err){$('erro').textContent=err.message}finally{ocupado=false}};
$('cancelar').onclick=()=>{if(!ocupado)$('modal').close()};$('modal').addEventListener('cancel',e=>{if(ocupado)e.preventDefault()});$('novo').onclick=()=>abrir().catch(e=>$('msg').textContent=e.message);$('buscar').onclick=()=>{pagina=0;carregar().catch(e=>$('msg').textContent=e.message)};$('anterior').onclick=()=>{if(pagina>0)pagina--;carregar().catch(e=>$('msg').textContent=e.message)};$('proxima').onclick=()=>{pagina++;carregar().catch(e=>$('msg').textContent=e.message)};
(async()=>{try{if(location.pathname==='/login'){$('entrada').hidden=false;return}eu=await api('/auth/me');$('nav').hidden=false;$('voltar').href=eu.papel==='admin'?'/painel':'/clientes';if(eu.trocar_senha&&location.pathname!='/senha'){location.href='/senha';return}if(location.pathname==='/senha'){$('troca').hidden=false;return}contas=location.pathname==='/usuarios';if(contas&&eu.papel!=='admin')throw Error('Somente administrador.');$('gestao').hidden=false;$('titulo').textContent=contas?'Usuários e permissões':'Clientes';$('novo').textContent=contas?'+ Novo usuário':'+ Novo cliente';$('buscaBox').hidden=contas;$('anterior').hidden=$('proxima').hidden=contas;$('cabeca').innerHTML=contas?'<tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Situação</th><th>Ações</th></tr>':'<tr><th>Cliente</th><th>Login</th><th>Plano / produto</th><th>Vencimento</th><th>Valor</th><th>Ações</th></tr>';await carregar()}catch(e){$('msg').textContent=e.message}})();
</script></html>
