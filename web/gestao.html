<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo | Painel</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;color:#eef0ff;font:15px 'Segoe UI',system-ui;background:radial-gradient(ellipse at top left,#25316266,transparent 55%),linear-gradient(135deg,#0d0b21,#171240);min-height:100vh}main{max-width:1100px;margin:auto;padding:30px 22px}a{color:#b6caff}nav{font-size:13px;margin-bottom:24px}header,.barra,.rodape{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{font-size:28px;margin:0}p,small,label{color:#aaa6ca;line-height:1.6}button{padding:10px 16px;font:inherit;font-size:13px;border-radius:10px;border:1px solid #ffffff20;color:#eef0ff;background:#ffffff09;cursor:pointer}button:hover{background:#ffffff18}button:disabled{opacity:.5}.primario{background:linear-gradient(135deg,#4f7cff,#8b5cf6);border:0}.perigo{color:#ff91a5}.card{background:linear-gradient(145deg,#1b1740,#221d52);border:1px solid #ffffff17;border-radius:18px;margin-top:26px;box-shadow:0 18px 40px #0004;overflow:hidden}.barra{padding:18px 22px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:17px 22px;border-bottom:1px solid #ffffff12}th{font-size:11px;color:#aaa6ca;text-transform:uppercase;letter-spacing:.8px}td button{margin:3px}tr:last-child td{border-bottom:0}.valor{color:#7ee0c3;font-size:18px}#msg{white-space:pre-wrap}dialog{background:linear-gradient(145deg,#1b1740,#221d52);color:#eef0ff;border:1px solid #ffffff24;border-radius:18px;width:min(550px,94vw);max-height:90vh;padding:26px;box-shadow:0 25px 80px #0008}dialog::backdrop{background:#070514cc;backdrop-filter:blur(6px)}h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.inteiro{grid-column:1/-1}label{display:block;font-size:12px;margin:0 0 7px}input:not([type=checkbox]),select{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff20;background:#0e0b2580;color:#eef0ff;font:inherit}input:focus,select:focus{outline:2px solid #4f7cff80}input:disabled{opacity:.6}input[type=checkbox]{accent-color:#8b5cf6}.rodape{justify-content:flex-end;border-top:1px solid #ffffff17;padding-top:20px;margin-top:22px}#erro{color:#ff91a5;white-space:pre-wrap}.nota{font-size:12px;margin:0;padding:16px 22px;border-top:1px solid #ffffff17}@media(max-width:600px){main{padding:22px 14px}.grid{grid-template-columns:1fr}.inteiro{grid-column:auto}td,th{padding:13px}h1{font-size:24px}}</style><main><nav><a href="/painel">Voltar ao painel</a> · <a href="/painel/produtos">Produtos</a> · <a href="/painel/planos">Planos</a></nav><header><div><h1 id="heading"></h1><p id="intro"></p></div><button class="primario" id="novo"></button></header><section class="card"><div class="barra"><span id="contagem"></span><label><input type="checkbox" id="arquivados"> Mostrar arquivados</label></div><div class="scroll"><table><thead id="cabeca"></thead><tbody id="lista"></tbody></table></div><p class="nota">Alterações valem para próximas operações. Clientes e lançamentos anteriores não são recalculados.</p></section><p id="msg" role="status"></p></main><dialog id="modal" aria-labelledby="titulo"><h2 id="titulo"></h2><form id="form"><div class="grid"><div class="inteiro"><label for="nome">Nome</label><input id="nome" maxlength="60" required></div><div id="campoProduto"><label for="produto">Produto</label><select id="produto"></select></div><div><label for="valor" id="rotuloValor"></label><input id="valor" inputmode="numeric" autocomplete="off" value="R$ 0,00" required><small>Digite 600 para R$ 6,00.</small></div><div><label for="dias">Duração em dias</label><input id="dias" type="number" min="1" max="3650" value="30" required></div><div id="campoConexoes"><label for="conexoes">Acessos sugeridos</label><input id="conexoes" type="number" min="1" value="1"></div><label id="campoFixa"><input id="fixa" type="checkbox"> Usar sempre esta duração</label><label><input id="ativo" type="checkbox" checked> Ativo</label></div><p id="erro" role="alert"></p><div class="rodape"><button type="button" id="cancelar">Cancelar</button><button class="primario" id="salvar">Salvar</button></div></form></dialog><script>
const $=id=>document.getElementById(id),ehPlano=location.pathname.includes('/planos'),base=ehPlano?'/planos':'/produtos',tipo=ehPlano?'plano':'produto',moeda=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let itens=[],produtos=[],editando=null,centavos=0,ocupado=false;
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'X-API-Key':localStorage.getItem('assinaturas.apiKey')||'','Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=r.status===204?null:await r.json();if(!r.ok){const e=Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));e.status=r.status;throw e}return d}
$('heading').textContent=ehPlano?'Planos e preços':'Produtos e custos';$('intro').textContent=ehPlano?'Planos são opcionais no cadastro de clientes.':'Defina o custo de um acesso e edite quando precisar.';$('novo').textContent='+ Novo '+tipo;$('rotuloValor').textContent=ehPlano?'Preço total de venda':'Custo de 1 acesso';$('campoProduto').hidden=!ehPlano;$('campoConexoes').hidden=!ehPlano;$('campoFixa').hidden=ehPlano;
function opcao(v,t){const o=document.createElement('option');o.value=v;o.textContent=t;$('produto').appendChild(o)}
async function carregar(){itens=await api(base);if(!ehPlano)itens=await Promise.all(itens.map(async p=>({...p,config:await api('/config-creditos/'+p.id)})));desenhar()}
function desenhar(){$('lista').replaceChildren();$('cabeca').innerHTML=ehPlano?'<tr><th>Plano</th><th>Produto</th><th>Preço total</th><th>Dias</th><th>Ações</th></tr>':'<tr><th>Produto</th><th>Custo por acesso</th><th>Duração</th><th>Ações</th></tr>';const visiveis=itens.filter(p=>$('arquivados').checked?!p.ativo:p.ativo);$('contagem').textContent=visiveis.length+($('arquivados').checked?' arquivado(s)':' ativo(s)');for(const p of visiveis){const tr=document.createElement('tr'),valores=ehPlano?[p.nome,p.produto||'Sem produto',moeda(p.valor),p.dias]:[p.nome,moeda(p.config.custo_credito),p.duracao_fixa?p.dias+' dias · fixa':'Flexível'];valores.forEach((v,i)=>{const td=document.createElement('td');td.textContent=v;if(i===(ehPlano?2:1))td.className='valor';tr.appendChild(td)});const td=document.createElement('td'),ed=document.createElement('button');ed.textContent='Editar';ed.onclick=()=>abrir(p);td.appendChild(ed);if(ehPlano){const ex=document.createElement('button');ex.textContent='Excluir';ex.className='perigo';ex.onclick=()=>excluir(p);td.appendChild(ex)}tr.appendChild(td);$('lista').appendChild(tr)}if(!visiveis.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=ehPlano?5:4;td.textContent=$('arquivados').checked?'Nenhum item arquivado.':'Nenhum item ativo. Use o botão de novo cadastro.';tr.appendChild(td);$('lista').appendChild(tr)}}
async function excluir(p){if(ocupado||!confirm('Excluir o plano '+p.nome+'? Se houver clientes vinculados, a exclusão será bloqueada.'))return;ocupado=true;try{await api(base+'/'+p.id,'DELETE');$('msg').textContent='Plano excluído.'}catch(e){if(e.status===409&&confirm('Este plano tem clientes vinculados. Arquivar sem alterar esses clientes?')){try{await api(base+'/'+p.id,'PATCH',{ativo:false});$('msg').textContent='Plano arquivado. Clientes preservados.'}catch(err){$('msg').textContent=err.message}}else $('msg').textContent=e.message}finally{ocupado=false;carregar().catch(e=>$('msg').textContent=e.message)}}
async function abrir(p=null){if(ocupado)return;try{if(ehPlano){produtos=await api('/produtos');$('produto').replaceChildren();opcao('','Selecione um produto');for(const prod of produtos.filter(x=>x.ativo))opcao(prod.nome,prod.nome);if(p?.produto&&!produtos.some(x=>x.ativo&&x.nome===p.produto))opcao(p.produto,p.produto+' (histórico)')}editando=p;$('titulo').textContent=(p?'Editar ':'Novo ')+tipo;$('nome').value=p?.nome||'';$('nome').disabled=!!p&&!ehPlano;centavos=Math.round(Number(ehPlano?p?.valor||0:p?.config?.custo_credito||0)*100);$('valor').value=moeda(centavos/100);$('dias').value=Math.max(1,p?.dias||30);$('fixa').checked=!!p?.duracao_fixa;$('conexoes').value=p?.conexoes||1;$('ativo').checked=p?p.ativo:true;if(ehPlano)$('produto').value=p?.produto||'';$('erro').textContent='';$('modal').showModal()}catch(e){$('msg').textContent=e.message}}
$('valor').oninput=()=>{centavos=Number($('valor').value.replace(/[^0-9]/g,'')||0);$('valor').value=moeda(centavos/100)};$('novo').onclick=()=>abrir();$('arquivados').onchange=desenhar;$('cancelar').onclick=()=>{if(!ocupado)$('modal').close()};$('modal').addEventListener('cancel',e=>{if(ocupado)e.preventDefault()});
$('form').onsubmit=async e=>{e.preventDefault();if(ocupado)return;const nome=$('nome').value.trim(),dias=Number($('dias').value),conexoes=Number($('conexoes').value),ativo=$('ativo').checked;if(!nome||!Number.isInteger(dias)||dias<1||dias>3650||!Number.isSafeInteger(centavos)||centavos<0||centavos>999999999999||(!ehPlano&&centavos===0)||(ehPlano&&(!$('produto').value||!Number.isInteger(conexoes)||conexoes<1))){$('erro').textContent='Confira nome, produto, valor, dias e acessos. Custo de acesso deve ser maior que zero.';return}ocupado=true;$('salvar').disabled=true;try{if(ehPlano){await api(editando?base+'/'+editando.id:base,editando?'PATCH':'POST',{nome,produto:$('produto').value,valor:centavos/100,dias,conexoes,ativo})}else if(editando){const c=editando.config;await api(base+'/'+editando.id,'PATCH',{duracao_fixa:$('fixa').checked,dias,ativo});await api('/config-creditos/'+editando.id,'PUT',{controlar_estoque:true,custo_credito:(centavos/100).toFixed(2),regra:c.regra==='nao_consumir'?(nome.toLowerCase()==='internet'?'somente_30_dias':'sempre'):c.regra,reutilizavel:c.regra==='nao_consumir'?nome.toLowerCase()==='internet':c.reutilizavel})}else{if(!ativo)throw Error('Crie o produto ativo e depois arquive se necessário.');await api(base,'POST',{nome,duracao_fixa:$('fixa').checked,dias,custo_ativacao:(centavos/100).toFixed(2)})}$('modal').close();$('msg').textContent='Salvo. Clientes e lançamentos anteriores preservados.';try{await carregar()}catch(err){$('msg').textContent='Salvo, mas a lista não atualizou: '+err.message}}catch(err){$('erro').textContent=err.message}finally{ocupado=false;$('salvar').disabled=false}};
carregar().catch(e=>$('msg').textContent=e.message);
</script></html>
