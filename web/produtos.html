<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Produtos e custos</title><style>body{font:16px system-ui;background:#171240;color:#eef0ff;max-width:850px;margin:30px auto;padding:16px}a{color:#bbcaff}label{display:block;margin-top:16px}input,button{font:inherit;padding:10px;margin:4px}input:not([type=checkbox]){display:block;max-width:90%}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #777}#mensagem{white-space:pre-wrap}</style><a href="/painel">Voltar ao painel</a> · <a href="/painel/planos">Planos</a><h1>Produtos e custo por acesso</h1><p>O custo por acesso e usado nas proximas ativacoes e renovacoes, multiplicado pela quantidade de acessos. Despesas anteriores nao mudam. Internet fora de 30 dias permanece sem custo.</p><h2 id="titulo">Novo produto</h2><label>Nome<input id="nome" maxlength="60"></label><label>Custo de 1 acesso (R$)<input id="custo" type="number" min="0.01" step="0.01" required></label><label><input id="fixa" type="checkbox"> Duracao fixa</label><label>Dias<input id="dias" type="number" min="1" max="3650" value="30"></label><button id="salvar">Salvar produto</button><button id="cancelar">Novo / Cancelar</button><p id="mensagem" role="status"></p><table><thead><tr><th>Produto</th><th>Custo por acesso</th><th>Acoes</th></tr></thead><tbody id="lista"></tbody></table><script>
const el=id=>document.getElementById(id);let editando=null,ocupado=false;
async function api(url,method='GET',body){const r=await fetch(url,{method,headers:{'Content-Type':'application/json','X-API-Key':localStorage.getItem('assinaturas.apiKey')||''},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function limpar(){editando=null;el('titulo').textContent='Novo produto';el('nome').value='';el('nome').disabled=false;el('custo').value='';el('fixa').checked=false;el('dias').value=30}
async function listar(){const produtos=await api('/produtos');el('lista').replaceChildren();for(const p of produtos){const c=await api('/config-creditos/'+p.id);const tr=document.createElement('tr');for(const texto of [p.nome,Number(c.custo_credito).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})]){const td=document.createElement('td');td.textContent=texto;tr.appendChild(td)}const td=document.createElement('td');const editar=document.createElement('button');editar.textContent='Editar';editar.onclick=()=>{if(ocupado)return;editando={p,c};el('titulo').textContent='Editar produto e custo';el('nome').value=p.nome;el('nome').disabled=true;el('custo').value=c.custo_credito;el('fixa').checked=p.duracao_fixa;el('dias').value=p.dias;window.scrollTo(0,0)};td.appendChild(editar);tr.appendChild(td);el('lista').appendChild(tr)}}
el('cancelar').onclick=()=>{if(!ocupado)limpar()};
el('salvar').onclick=async()=>{if(ocupado)return;const nome=el('nome').value.trim(),custo=Number(el('custo').value),dias=Number(el('dias').value);if(!nome||!Number.isFinite(custo)||custo<=0||!Number.isInteger(dias)||dias<1||dias>3650){el('mensagem').textContent='Informe nome, custo positivo e dias entre 1 e 3650.';return}ocupado=true;el('salvar').disabled=true;try{if(editando){const id=editando.p.id;await api('/produtos/'+id,'PATCH',{duracao_fixa:el('fixa').checked,dias});await api('/config-creditos/'+id,'PUT',{controlar_estoque:true,custo_credito:custo.toFixed(2),regra:editando.c.regra==='nao_consumir'?(nome.toLowerCase()==='internet'?'somente_30_dias':'sempre'):editando.c.regra,reutilizavel:editando.c.regra==='nao_consumir'?nome.toLowerCase()==='internet':editando.c.reutilizavel})}else{await api('/produtos','POST',{nome,duracao_fixa:el('fixa').checked,dias,custo_ativacao:custo.toFixed(2)})}await listar();limpar();el('mensagem').textContent='Produto e custo salvos. Lancamentos anteriores foram preservados.'}catch(e){el('mensagem').textContent=e.message}finally{ocupado=false;el('salvar').disabled=false}};
listar().catch(e=>el('mensagem').textContent=e.message);
</script></html>
